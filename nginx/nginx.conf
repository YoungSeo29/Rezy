events {
    worker_connections 4096;
}

http {
    # 앱 서버 2대로 요청을 나눠 보낸다
    upstream rezy_app {
        least_conn;                                        # 처리 중인 연결이 적은 쪽으로
        server 172.31.41.240:8080 max_fails=3 fail_timeout=5s;
        server APP2_사설IP:8080   max_fails=3 fail_timeout=5s;
        keepalive 128;                                     # 백엔드 연결 재사용
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://rezy_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}