# DB 전용 서버에서 띄우는 구성
# 앱 서버의 docker-compose.prod.yml 에서 mariadb 를 떼어낸 것
services:

  mariadb:
    image: mariadb:11.5
    container_name: rezy-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: rezy
    command: ["--max-connections=300"]
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    container_name: rezy-redis
    ports:
      - "6379:6379"          # 앱 서버 2대가 네트워크로 접속해야 하므로 노출
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  mariadb-data: