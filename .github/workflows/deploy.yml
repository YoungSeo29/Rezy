name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4      # 의존성 캐시 - 2회차부터 빨라짐

      - name: 테스트 실행
        run: ./gradlew test

      - name: 테스트 결과를 PR 에 표시
        if: always()                              # 실패해도 리포트는 남긴다
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: build/test-results/test/*.xml

      - name: HTML 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test